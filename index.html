<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Attendance</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f4f6f8;
    }

    h1 {
      margin-bottom: 5px;
    }

    #reader {
      max-width: 400px;
      margin: 20px auto;
      background: white;
      padding: 10px;
      border-radius: 15px;
    }

    #result {
      max-width: 400px;
      margin: 20px auto;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>QR Attendance</h1>

  <p>Scan QR Code</p>

  <div id="reader"></div>

  <div id="result">
    📷 Waiting for scan...
  </div>

  <script>

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbx1NXEUGfm459tBjtnA8wU8ie70-J14jaubbZsa4-xzlL8EmbDCxhFB8arYNvJZHSGZtQ/exec";

    let isProcessing = false;
    let lastScanned = "";

    function onScanSuccess(decodedText) {

      if (isProcessing) {
        return;
      }

      if (decodedText === lastScanned) {
        return;
      }

      isProcessing = true;
      lastScanned = decodedText;

      document.getElementById("result").innerHTML =
        "⏳ Processing...";

      fetch(
        SCRIPT_URL +
        "?id=" +
        encodeURIComponent(decodedText)
      )
      .then(response => response.json())
      .then(result => {

        if (result.success) {

          document.getElementById("result").innerHTML =
            '<div class="success">' +
            '✅ Attendance Recorded<br><br>' +
            'Name: ' + result.name + '<br>' +
            'Date: ' + result.date + '<br>' +
            'Time: ' + result.time +
            '</div>';

        } else {

          document.getElementById("result").innerHTML =
            '<div class="error">' +
            '❌ ' + result.message +
            '</div>';

        }

        setTimeout(function() {

          isProcessing = false;
          lastScanned = "";

          document.getElementById("result").innerHTML =
            "📷 Ready for next scan";

        }, 2000);

      })
      .catch(error => {

        document.getElementById("result").innerHTML =
          '<div class="error">' +
          '❌ Connection Error' +
          '</div>';

        isProcessing = false;
        lastScanned = "";

      });

    }

    function onScanFailure(error) {
      // Ignore normal scanning failures
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );

    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>

</body>
</html>
